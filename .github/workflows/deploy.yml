name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_CHAT_MODEL: ${{ vars.VITE_CHAT_MODEL }}
      VITE_RAG_EMBEDDING_MODEL: ${{ vars.VITE_RAG_EMBEDDING_MODEL }}
      VITE_RAG_INDEX_URL: ${{ vars.VITE_RAG_INDEX_URL }}
      VITE_RAG_CHUNKS_URL: ${{ vars.VITE_RAG_CHUNKS_URL }}
      VITE_RAG_EMBEDDINGS_URL: ${{ vars.VITE_RAG_EMBEDDINGS_URL }}
      VITE_RAG_INDEX_NAME: ${{ vars.VITE_RAG_INDEX_NAME }}
      VITE_RAG_INDEX_VERSION: ${{ vars.VITE_RAG_INDEX_VERSION }}
      VITE_RAG_INDEX_ID: ${{ vars.VITE_RAG_INDEX_ID }}
      VITE_RAG_INDEX_TYPE: ${{ vars.VITE_RAG_INDEX_TYPE }}
      VITE_RAG_INDEX_SIZE: ${{ vars.VITE_RAG_INDEX_SIZE }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
